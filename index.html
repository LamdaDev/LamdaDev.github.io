<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9f0" />
    <script>
      // Apply the visitor's explicit choice before styles or portfolio content paint.
      try {
        const theme = localStorage.getItem('daniel-theme') === 'night' ? 'night' : 'day';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = theme === 'night' ? '#191923' : '#fff9f0';
      } catch { document.documentElement.dataset.theme = 'day'; }
    </script>
    <meta name="description" content="Daniel Lam — software developer and Concordia Software Engineering Co-op student. Backend services, data pipelines, and thoughtful web and mobile applications." />
    <title>Daniel Lam · Developer & curious human</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650;700;750;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
